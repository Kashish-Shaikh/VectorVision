# Vector Vision — single source of configuration.
# Every script reads this file. Change paths here, never inside code.

project:
  seed: 42
  device: auto            # auto | cuda | cpu

study_area:
  country: India
  state: Maharashtra
  district: Gondiya       # spelling used by FAO GAUL
  grid_m: 100             # proposal: 100 m x 100 m cells
  season_start: "2020-09-01"   # post-monsoon, when standing water peaks
  season_end: "2020-11-30"
  climate_years: [2016, 2020]  # multi-year window for climate features

earth_engine:
  project: vectorvision-510012
  enabled: true

paths:
  # Stage 1 locates the dataset inside this folder automatically.
  sen2lulc_root: data/satellite/sen2lulc
  floodnet_root: "/kaggle/input/datasets/aletbm/aerial-imagery-dataset-floodnet-challenge/FloodNet Challenge - Track 1"
  vectors_dir: data/vectors
  climate_dir: data/climate
  boundaries_dir: data/boundaries
  models_dir: models
  outputs_dir: outputs

satellite_unet:
  in_channels: 3          # Sen-2 LULC ships RGB (B4, B3, B2) only
  base_width: 32
  epochs: 60
  batch_size: 64
  lr: 0.001               # peak learning rate (one-cycle). Gradient clipping keeps it stable.
  train_subset: 30000     # of ~149,600 training tiles; raise if you have a strong GPU
  val_tiles: 4000         # validation stays at the NATURAL water share, never enriched
  water_rich_share: 0.5   # at most half the training tiles are chosen for containing water
  water_rich_min: 0.10    # a tile counts as water-rich above 10% water pixels
  min_water_blob_px: 6    # water blobs smaller than this are label speckle (Stage 1 measures it)
  num_workers: 2

drone_unet:
  image_size: 512
  base_width: 32
  epochs: 60
  batch_size: 8
  lr: 0.0005
  water_classes: [1, 3, 5, 8]

  # FloodNet:
  # 3 = road flooded
  # 5 = water
  # 8 = pool
  #
  # Building-flooded (1) is intentionally excluded because those pixels
  # are mostly roofs/walls rather than standing water.
  water_class_ids: [5, 8, 3]

  frame_min_water_px: 64

occurrence:
  # Real field records of where malaria vectors were found. This is the TARGET
  # for the risk model, so it is never invented.
  source: gbif
  genus: Anopheles
  country: IN
  min_year: 2000
  max_records: 10000
  thin_km: 1.0
  background_ratio: 5
  background_min_km: 1.0
  background_oversample: 2.5


risk_model:
  n_estimators: 500
  pseudo_absence_ratio: 5     # Sinka et al. style presence : background
  spatial_block_deg: 1.0      # spatial cross-validation block size
